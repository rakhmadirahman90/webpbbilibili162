      #boot-error { display: none; margin-top: 18px; padding: 12px; border-radius: 12px; background: rgba(239,68,68,.10); color: #fca5a5; font-size: 13px; line-height: 1.5; }

    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div id="boot-card">
          <img id="boot-logo" src="/logo_pb_bilibili_162.png" alt="PB Bilibili 162" />
          <h1 id="boot-title">PB Bilibili 162</h1>

          <div id="boot-spinner" aria-hidden="true"></div>
          <div id="boot-error"></div>
        </div>
      </div>
    </div>
    <noscript>JavaScript diperlukan untuk menjalankan aplikasi PB Bilibili 162.</noscript>
    <script>
      (() => {
        const bootError = document.getElementById('boot-error');
        const showBootError = (message) => {
          if (!bootError) return;
          bootError.style.display = 'block';
          bootError.textContent = 'Aplikasi gagal dimuat. Muat ulang halaman untuk mencoba lagi.';
          console.error('[PB162 boot]', message);
        };
        window.addEventListener('error', (event) => showBootError(event.error || event.message));
        window.addEventListener('unhandledrejection', (event) => showBootError(event.reason));

        // v13: invalidate legacy PWA/service-worker/cache state after the
        // navigation contract fix. Do not block the app forever if cleanup is unavailable.
        const cleanupKey = 'pb162-legacy-cache-cleanup-v13';
        const reloadKey = 'pb162-legacy-cache-reload-v13';
        try {
          const needsReload = !sessionStorage.getItem(reloadKey);
          sessionStorage.setItem(reloadKey, '1');
          localStorage.setItem(cleanupKey, '1');
          const cleanup = [];
          if ('serviceWorker' in navigator) {
            cleanup.push(navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))).catch(() => []));
          }
          if ('caches' in window) {
            cleanup.push(caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => []));
          }
          Promise.all(cleanup).then(() => {
            // A single controlled reload ensures a stale service-worker response
            // cannot keep an obsolete hashed JS bundle alive indefinitely.
            if (needsReload && document.readyState === 'loading') window.location.reload();
          }).catch(() => {});
        } catch (_) {}

        // Recover cleanly when Vite reports a stale dynamic-import chunk after a deployment.
        window.addEventListener('vite:preloadError', (event) => {
          try { event.preventDefault(); } catch (_) {}
          const key = 'pb162-vite-preload-reload-v1';
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            window.location.reload();
          }
        });

        window.setTimeout(() => {
          if (document.getElementById('boot')) showBootError('Startup timeout');
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
