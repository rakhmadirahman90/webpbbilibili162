name: Apply Chairman Welcome Menu Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply chairman welcome menu patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App and Sidebar
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          old = "const AdminPopup = lazy(() => import('./components/AdminPopup'));"
          new = old + "\nconst AdminSambutanKetua = lazy(() => import('./components/AdminSambutanKetua'));"
          if text.count(old) != 1:
              raise SystemExit('AdminPopup import anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '<Route path="popup" element={isAdmin ? <AdminPopup /> : <Navigate to="/admin/dashboard" replace />} /> '
          new = old + '\n              <Route path="sambutan-ketua" element={isAdmin ? <AdminSambutanKetua /> : <Navigate to="/admin/dashboard" replace />} />'
          if text.count(old) != 1:
              raise SystemExit('Admin popup route anchor not found exactly once')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          sidebar = Path('src/components/Sidebar.tsx')
          text = sidebar.read_text(encoding='utf-8')
          old = "        { name: 'Kelola Pop-up', path: 'popup', icon: Megaphone, adminOnly: true },"
          new = old + "\n        { name: 'Edit Sambutan Ketua Umum', path: 'sambutan-ketua', icon: MessageSquare, adminOnly: true },"
          if text.count(old) != 1:
              raise SystemExit('Sidebar popup menu anchor not found exactly once')
          text = text.replace(old, new, 1)
          sidebar.write_text(text, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/Sidebar.tsx .github/workflows/patch-ketua-menu.yml
          git rm -f .github/workflows/patch-ketua-menu.yml
          git commit -m "feat: apply chairman welcome menu patch"
          git push origin HEAD:main
