name: One-time mobile Atlet sidebar fix

on:
  push:
    paths:
      - '.github/workflows/mobile-atlet-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile Atlet navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/Navbar.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''onClick={() => {
                          if (isDropdown) {
                            setActiveDropdown(activeDropdown === menu.id ? null : menu.id);
                          } else {
                            handleNavClick(menu.path);
                          }
                        }}'''

          new = '''onClick={() => {
                          // Mobile: Atlet parent navigates directly and closes the drawer.
                          // Other dropdown menus retain their existing behavior.
                          if (menu.path?.toLowerCase() === 'atlet' || menu.label?.toLowerCase() === 'atlet') {
                            handleNavClick('atlet');
                            return;
                          }
                          if (isDropdown) {
                            setActiveDropdown(activeDropdown === menu.id ? null : menu.id);
                          } else {
                            handleNavClick(menu.path);
                          }
                        }}'''

          if old not in text:
              raise SystemExit('Target mobile menu handler was not found; aborting without changes.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Navbar.tsx
          git rm .github/workflows/mobile-atlet-fix.yml
          git commit -m "fix mobile Atlet sidebar navigation"
          git push
