name: Fix Prestasi Menu

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: complete Prestasi menu') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Prestasi routing and Supabase filter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          news = Path('src/components/News.tsx')
          s = news.read_text()

          old = "const [searchParams, setSearchParams] = useSearchParams();"
          new = "const [searchParams, setSearchParams] = useSearchParams();\n  const requestedCategory = (searchParams.get('category') || '').trim();"
          if 'const requestedCategory = (searchParams.get(\'category\') || \'\').trim();' not in s:
              if old not in s:
                  raise SystemExit('News.tsx: searchParams marker not found')
              s = s.replace(old, new, 1)

          s = s.replace(
              "const [tempCategory, setTempCategory] = useState('ALL ARTICLES');",
              "const [tempCategory, setTempCategory] = useState(() => requestedCategory ? requestedCategory.toUpperCase() : 'ALL ARTICLES');",
              1,
          )
          s = s.replace(
              "const [selectedCategory, setSelectedCategory] = useState('ALL ARTICLES');",
              "const [selectedCategory, setSelectedCategory] = useState(() => requestedCategory ? requestedCategory.toUpperCase() : 'ALL ARTICLES');",
              1,
          )

          old_query = """      const { data, error } = await supabase
        .from('berita')
        .select('id, judul, ringkasan, konten, kategori, gambar_url, tanggal, created_at, likes, views')
        .order('tanggal', { ascending: false })
        .order('created_at', { ascending: false });"""
          new_query = """      let beritaQuery = supabase
        .from('berita')
        .select('id, judul, ringkasan, konten, kategori, gambar_url, tanggal, created_at, likes, views');

      if (requestedCategory) {
        beritaQuery = beritaQuery.ilike('kategori', requestedCategory);
      }

      const { data, error } = await beritaQuery
        .order('tanggal', { ascending: false })
        .order('created_at', { ascending: false });"""
          if 'let beritaQuery = supabase' not in s:
              if old_query not in s:
                  raise SystemExit('News.tsx: Supabase berita query marker not found')
              s = s.replace(old_query, new_query, 1)

          marker = "  const fetchComments = async (beritaId: string) => {"
          effect = """  useEffect(() => {
    if (!requestedCategory) return;
    const normalized = requestedCategory.toUpperCase();
    setSelectedCategory(normalized);
    setTempCategory(normalized);
    setCurrentPage(1);
    fetchNews();
  }, [requestedCategory]);

"""
          if effect.strip() not in s:
              if marker not in s:
                  raise SystemExit('News.tsx: fetchComments marker not found')
              s = s.replace(marker, effect + marker, 1)

          news.write_text(s)

          app = Path('src/App.tsx')
          a = app.read_text()
          a = a.replace("'berita', 'news', 'faq'", "'berita', 'news', 'prestasi', 'faq'", 1)
          a = a.replace("'berita', 'news', 'faq', 'sambutan'", "'berita', 'news', 'prestasi', 'faq', 'sambutan'", 1)
          a = a.replace(
              "{(activeView === 'berita' || activeView === 'news') && <News />}",
              "{(activeView === 'berita' || activeView === 'news' || activeView === 'prestasi') && <News />}",
              1,
          )
          app.write_text(a)
          PY

      - name: Verify patch
        run: |
          grep -q "requestedCategory" src/components/News.tsx
          grep -q "ilike('kategori', requestedCategory)" src/components/News.tsx
          grep -q "activeView === 'prestasi'" src/App.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/News.tsx src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: complete Prestasi menu"
          git push
