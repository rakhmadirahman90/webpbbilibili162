name: Repair Admin Popup Save

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: repair AdminPopup Supabase save') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch AdminPopup
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          p = Path('src/components/AdminPopup.tsx')
          original = subprocess.check_output([
              'git','show','60695dcf18ba05a0a4530223e0398e6ea9ccf2d5:src/components/AdminPopup.tsx'
          ], text=True)

          text = original
          text = text.replace(
              "const renderDescriptionWithLinks = (text: string) => {",
              "const isUuid = (value: unknown): value is string => typeof value === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);\n\nconst renderDescriptionWithLinks = (text: string) => {"
          )

          old_persist = """    // 2. Sync to Supabase `konfigurasi_popup` table
    try {
      if (standardizedList.length > 0) {
        const dbUpdates = standardizedList.map(({ id, urutan, judul, deskripsi, url_gambar, is_active, file_url }) => ({
          id,
          urutan: urutan ?? 0,
          judul: judul || '',
          deskripsi: deskripsi || '',
          url_gambar: url_gambar || '',
          is_active: is_active ?? true,
          file_url: file_url || null
        }));
        await supabase.from('konfigurasi_popup').upsert(dbUpdates, { onConflict: 'id' });
      }
    } catch (err) {
      console.warn(\"Database sync warning (handled via siteSettingsHelper):\", err);
    }
"""
          new_persist = """    // 2. Sync only real UUID rows to Supabase. Legacy UI-only popup IDs must never
    // be sent to PostgreSQL because konfigurasi_popup.id is UUID.
    if (standardizedList.length > 0) {
      const dbUpdates = standardizedList
        .filter(item => isUuid(item.id))
        .map(({ id, urutan, judul, deskripsi, url_gambar, is_active, file_url }) => ({
          id,
          urutan: urutan ?? 0,
          judul: judul || '',
          deskripsi: deskripsi || '',
          url_gambar: url_gambar || '',
          is_active: is_active ?? true,
          file_url: file_url || null
        }));
      if (dbUpdates.length > 0) {
        const { error } = await supabase.from('konfigurasi_popup').upsert(dbUpdates, { onConflict: 'id' });
        if (error) throw new Error(`Supabase popup sync failed: ${error.message}`);
      }
    }
"""
          if old_persist not in text:
              raise SystemExit('persist block not found')
          text = text.replace(old_persist, new_persist)

          start = text.index('  const handleSave = async (e: React.FormEvent) => {')
          end = text.index('\n  const startEdit =', start)
          new_handle = r'''  const handleSave = async (e: React.FormEvent) => {
    e.preventDefault();
    if (!newPopup.url_gambar) return Swal.fire('Opps!', 'Harap unggah gambar terlebih dahulu', 'warning');

    setIsSaving(true);
    try {
      const payload = {
        judul: newPopup.judul,
        deskripsi: newPopup.deskripsi,
        url_gambar: newPopup.url_gambar,
        file_url: newPopup.file_url || null,
        is_active: true
      };

      const rowId = editingId || (globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`);
      if (!isUuid(rowId)) throw new Error('Gagal membuat ID UUID pop-up yang valid.');

      let dbRow: PopupConfig;
      if (editingId) {
        const { data, error } = await supabase
          .from('konfigurasi_popup')
          .update(payload)
          .eq('id', rowId)
          .select('*')
          .single();
        if (error) throw new Error(`Gagal memperbarui Supabase: ${error.message}`);
        dbRow = data as PopupConfig;
      } else {
        const { data, error } = await supabase
          .from('konfigurasi_popup')
          .insert([{ ...payload, id: rowId, urutan: popups.length }])
          .select('*')
          .single();
        if (error || !data) throw new Error(`Gagal menyimpan ke Supabase: ${error?.message || 'Database tidak mengembalikan data.'}`);
        dbRow = data as PopupConfig;
      }

      const updatedList = editingId
        ? popups.map(p => p.id === rowId ? { ...p, ...dbRow } : p)
        : [...popups, dbRow];

      await persistPopups(updatedList);
      await fetchPopups(true);

      Swal.fire({
        title: 'Berhasil',
        text: editingId ? 'Pop-up diperbarui dan tersimpan di Supabase' : 'Pop-up baru tersimpan di Supabase',
        icon: 'success',
        background: '#0F172A',
        color: '#fff'
      });

      setEditingId(null);
      setNewPopup({ url_gambar: '', judul: '', deskripsi: '', file_url: '' });
      setPreviewImage(null);
    } catch (err: any) {
      console.error('[AdminPopup] Supabase save failed:', err);
      await fetchPopups(true);
      Swal.fire({
        title: 'Gagal menyimpan',
        text: err?.message || 'Pop-up gagal disimpan ke database Supabase.',
        icon: 'error',
        background: '#0F172A',
        color: '#fff'
      });
    } finally {
      setIsSaving(false);
    }
  };
'''
          text = text[:start] + new_handle + text[end:]
          p.write_text(text, encoding='utf-8')

      - name: Commit repaired component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminPopup.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair AdminPopup Supabase save"
          git push
