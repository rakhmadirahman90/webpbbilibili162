name: Supabase Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: read

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: missjyvqfehamtpyodjr

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare backup folders
        run: mkdir -p backup/database backup/storage

      - name: Backup roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only

      - name: Backup schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/schema.sql

      - name: Backup data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Discover Storage buckets
        run: |
          supabase storage ls --project-ref "$SUPABASE_PROJECT_REF" > backup/storage-buckets.txt
          cat backup/storage-buckets.txt

      - name: Backup all Storage buckets
        shell: bash
        run: |
          set -euo pipefail
          while read -r bucket; do
            [ -z "$bucket" ] && continue
            case "$bucket" in
              ss://*) bucket="${bucket#ss://}" ;;
            esac
            bucket="${bucket%%/*}"
            [ -z "$bucket" ] && continue
            echo "Backing up bucket: $bucket"
            mkdir -p "backup/storage/$bucket"
            supabase storage cp -r "ss://$bucket" "backup/storage/$bucket" --experimental
          done < <(grep -E '^ss://|^[A-Za-z0-9._-]+$' backup/storage-buckets.txt || true)

      - name: Create backup archive
        run: tar -czf "supabase-backup-${{ github.run_number }}.tar.gz" backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: "supabase-backup-${{ github.run_number }}.tar.gz"
          retention-days: 30
