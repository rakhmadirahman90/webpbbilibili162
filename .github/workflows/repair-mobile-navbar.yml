name: Repair Mobile Navbar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'auto: repair mobile navbar') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Navbar.tsx
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/Navbar.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const getSubMenus = (parentId: string) => {
    const parentItem = navData.find(i => i.id === parentId);
    return navData.filter(item => {
      if (!item || !item.parent_id || item.parent_id === 'none' || item.parent_id === '') return false;
      if (item.parent_id === parentId) return true;
      if (parentItem && item.parent_id === parentItem.id) return true;
      return false;
    }).sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
  };'''

          new = '''  const getSubMenus = (parentId: string) => {
    const parentItem = navData.find(i => i.id === parentId);
    const normalizedParentPath = String(parentItem?.path || '').toLowerCase().trim();
    const normalizedParentLabel = String(parentItem?.label || '').toLowerCase().trim();

    const children = navData.filter(item => {
      if (!item || item.parent_id === null || item.parent_id === undefined || item.parent_id === '' || item.parent_id === 'none') return false;
      return String(item.parent_id) === String(parentId) || String(item.parent_id) === String(parentItem?.id || '');
    }).sort((a, b) => (a.order_index || 0) - (b.order_index || 0));

    if (children.length > 0) return children;

    // Resilient fallback: Supabase records may contain different UUIDs or a
    // parent row without its children. Use the canonical menu definition so
    // every dropdown, especially Atlet, remains functional on mobile.
    const defaultParent = DEFAULT_NAV_ITEMS.find(item =>
      String(item.path || '').toLowerCase().trim() === normalizedParentPath ||
      String(item.label || '').toLowerCase().trim() === normalizedParentLabel
    );

    if (!defaultParent) return [];

    return DEFAULT_NAV_ITEMS
      .filter(item => String(item.parent_id || '') === String(defaultParent.id))
      .sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
  };'''

          if old not in text:
              raise SystemExit('Expected getSubMenus block was not found')
          text = text.replace(old, new, 1)

          replacements = {
            'w-[270px] sm:w-[290px] max-w-[85vw]': 'w-[300px] sm:w-[320px] max-w-[88vw]',
            'bg-[#0b1224] border-r border-white/10 flex flex-col justify-between overflow-hidden shadow-2xl': 'bg-[#08101f]/98 border-r border-white/10 flex flex-col justify-between overflow-hidden shadow-[20px_0_60px_rgba(0,0,0,0.45)] backdrop-blur-xl',
            'py-2.5 px-3.5 border-b border-white/10': 'py-3 px-4 border-b border-white/10',
            'relative w-9 h-9 flex items-center justify-center shrink-0': 'relative w-10 h-10 flex items-center justify-center shrink-0',
            'p-1.5 rounded-lg bg-slate-800/80': 'w-10 h-10 p-0 rounded-xl bg-slate-800/80 border border-white/10',
            'flex-1 overflow-y-auto custom-scrollbar py-2 px-2 space-y-1 flex flex-col justify-start': 'flex-1 overflow-y-auto custom-scrollbar py-4 px-3 space-y-1.5 flex flex-col justify-start',
            'w-full px-3 py-2 text-[11px] font-bold tracking-wider uppercase rounded-lg': 'w-full min-h-[48px] px-3.5 py-3 text-[12px] font-bold tracking-[0.045em] uppercase rounded-xl',
            'gap-2': 'gap-2.5',
            "isExpanded ? 'bg-blue-600/15 text-blue-400' : ''": "isExpanded ? 'bg-gradient-to-r from-blue-600/25 via-blue-500/10 to-transparent text-blue-300 ring-1 ring-blue-500/20 shadow-lg shadow-blue-950/20' : 'text-slate-200'",
            'bg-[#070c18]/80 border-l-2 border-blue-500/50 my-1 ml-2 pl-2 pr-1 flex flex-col py-1 gap-0.5 animate-in fade-in duration-200 rounded-r-lg': 'bg-[#050b16]/75 border border-white/5 border-l-2 border-l-blue-500/60 my-1.5 ml-2.5 pl-2 pr-1.5 flex flex-col py-2 gap-1 animate-in fade-in duration-200 rounded-r-xl shadow-inner',
            'text-left py-1.5 px-2 text-[10.5px] font-semibold': 'text-left min-h-[42px] py-2.5 px-2.5 text-[11.5px] font-semibold',
            'space-y-1.5': 'space-y-2',
            'px-3 py-2 text-[11px] font-bold tracking-wider uppercase text-emerald-400': 'min-h-[48px] px-3.5 py-3 text-[12px] font-bold tracking-[0.045em] uppercase text-emerald-300',
            'px-3 py-2 text-[11px] font-bold tracking-wider uppercase text-blue-400': 'min-h-[48px] px-3.5 py-3 text-[12px] font-bold tracking-[0.045em] uppercase text-blue-300',
            'p-2.5 border-t border-white/10': 'p-3 border-t border-white/10',
            'bg-[#151d30]/60 border border-white/10 hover:border-blue-500/40 p-2 rounded-xl': 'bg-gradient-to-r from-[#111c32] to-[#0d1729] border border-white/10 hover:border-blue-500/40 p-3 rounded-2xl shadow-lg shadow-black/10',
            'w-7 h-7 rounded-lg': 'w-9 h-9 rounded-xl',
            '<Radio size={14}': '<Radio size={16}',
            'text-[8px] font-black': 'text-[9px] font-black',
            'text-[10px] font-bold': 'text-[11px] font-bold',
            'gap-5 pt-0.5': 'gap-7 pt-1',
            '<Youtube size={15} />': '<Youtube size={18} />',
            '<Instagram size={15} />': '<Instagram size={18} />',
            '<Facebook size={15} />': '<Facebook size={18} />',
            '<Twitter size={15} />': '<Twitter size={18} />',
          }

          for a, b in replacements.items():
              text = text.replace(a, b)

          path.write_text(text, encoding='utf-8')
          print('Navbar mobile UX + dropdown fallback patched successfully')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Navbar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "auto: repair mobile navbar"
          git push