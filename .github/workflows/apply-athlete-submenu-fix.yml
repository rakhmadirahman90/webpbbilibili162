name: Apply Mobile Athlete Submenu Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[athlete-submenu-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repair
        run: node scripts/repair-mobile-athlete-submenu.cjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Navbar.tsx
          if git diff --cached --quiet; then
            echo "No Navbar changes needed"
            exit 0
          fi
          git commit -m "fix: restore mobile Atlet submenu [athlete-submenu-fixed]"
          git push
