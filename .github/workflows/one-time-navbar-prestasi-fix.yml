name: One-time Prestasi navigation repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair pointer-down navigation and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/Navbar.tsx')
          text = path.read_text(encoding='utf-8')

          old = "const handleNavigationPointerDown = (path: string, subPath?: string) => { preloadNavigation(path, subPath); };"
          new = "const handleNavigationPointerDown = (path: string, subPath?: string) => { if (normalizeNavigationPath(subPath || '') === 'prestasi') return; preloadNavigation(path, subPath); };"
          if old not in text:
              raise SystemExit('Expected Navbar handler was not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/one-time-navbar-prestasi-fix.yml')
          workflow.unlink()

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Navbar.tsx .github/workflows/one-time-navbar-prestasi-fix.yml
          git commit -m "fix: prevent parent navigation from overriding Prestasi submenu"
          git push
