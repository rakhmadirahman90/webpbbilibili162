name: Repair Mobile Sidebar Interaction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-sidebar-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Navbar mobile interaction
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/Navbar.tsx';
          let s = fs.readFileSync(path, 'utf8');

          const oldTrigger = `          {/* MOBILE MENU TRIGGER */}\n          <button className="lg:hidden p-2 text-slate-300 hover:text-white transition-colors" onClick={() => setIsMobileMenuOpen(true)}>\n            <Menu size={28} />\n          </button>`;
          const newTrigger = `          {/* MOBILE MENU TRIGGER — explicit pointer/touch handling */}\n          <button\n            type="button"\n            aria-label="Buka menu navigasi"\n            aria-expanded={isMobileMenuOpen}\n            onPointerDown={(e) => {\n              e.preventDefault();\n              e.stopPropagation();\n              setActiveDropdown(null);\n              setIsMobileMenuOpen(true);\n            }}\n            onClick={(e) => {\n              e.preventDefault();\n              e.stopPropagation();\n              setActiveDropdown(null);\n              setIsMobileMenuOpen(true);\n            }}\n            className="lg:hidden relative z-[10001] flex items-center justify-center w-11 h-11 rounded-xl bg-slate-800/90 border border-white/10 text-slate-200 hover:text-white hover:bg-slate-700 active:scale-95 transition-all cursor-pointer touch-manipulation select-none"\n          >\n            <Menu size={28} strokeWidth={2.2} />\n          </button>`;

          if (!s.includes(oldTrigger)) throw new Error('Mobile menu trigger block not found');
          s = s.replace(oldTrigger, newTrigger);

          const oldBackdrop = `          <div \n            className="lg:hidden fixed inset-0 z-[999998] bg-black/60 backdrop-blur-xs animate-fade-in cursor-pointer"\n            onClick={() => setIsMobileMenuOpen(false)}\n          />`;
          const newBackdrop = `          <div\n            role="presentation"\n            className="lg:hidden fixed inset-0 z-[999998] bg-black/60 backdrop-blur-xs animate-fade-in cursor-pointer touch-manipulation"\n            onPointerDown={(e) => {\n              e.preventDefault();\n              setIsMobileMenuOpen(false);\n              setActiveDropdown(null);\n            }}\n            onClick={() => {\n              setIsMobileMenuOpen(false);\n              setActiveDropdown(null);\n            }}\n          />`;
          if (!s.includes(oldBackdrop)) throw new Error('Mobile backdrop block not found');
          s = s.replace(oldBackdrop, newBackdrop);

          const oldDrawer = `          <div className="lg:hidden fixed inset-y-0 left-0 w-[270px] sm:w-[290px] max-w-[85vw] h-[100dvh] z-[999999] bg-[#0b1224] border-r border-white/10 flex flex-col justify-between overflow-hidden shadow-2xl animate-slide-in-left">`;
          const newDrawer = `          <div\n            role="dialog"\n            aria-modal="true"\n            aria-label="Menu navigasi PB Bilibili 162"\n            className="lg:hidden fixed inset-y-0 left-0 w-[270px] sm:w-[290px] max-w-[85vw] h-[100dvh] z-[999999] bg-[#0b1224] border-r border-white/10 flex flex-col justify-between overflow-hidden shadow-2xl animate-slide-in-left touch-pan-y"\n            onPointerDown={(e) => e.stopPropagation()}\n          >`;
          if (!s.includes(oldDrawer)) throw new Error('Mobile drawer block not found');
          s = s.replace(oldDrawer, newDrawer);

          const oldClose = `              <button \n                onClick={() => setIsMobileMenuOpen(false)} \n                className="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 transition-all active:scale-95 flex items-center justify-center shrink-0 ml-1"`;
          const newClose = `              <button\n                type="button"\n                onPointerDown={(e) => { e.preventDefault(); e.stopPropagation(); setIsMobileMenuOpen(false); setActiveDropdown(null); }}\n                onClick={() => { setIsMobileMenuOpen(false); setActiveDropdown(null); }}\n                className="text-slate-300 hover:text-white p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 transition-all active:scale-95 flex items-center justify-center shrink-0 ml-1 cursor-pointer touch-manipulation"`;
          if (!s.includes(oldClose)) throw new Error('Mobile close button block not found');
          s = s.replace(oldClose, newClose);

          const oldMenuList = `            <div className="flex-1 overflow-y-auto custom-scrollbar py-2 px-2 space-y-1 flex flex-col justify-start">`;
          const newMenuList = `            <div className="flex-1 min-h-0 overflow-y-auto overscroll-contain custom-scrollbar py-2 px-2 space-y-1 flex flex-col justify-start touch-pan-y">`;
          if (!s.includes(oldMenuList)) throw new Error('Mobile menu list block not found');
          s = s.replace(oldMenuList, newMenuList);

          fs.writeFileSync(path, s);
          NODE

      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Navbar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: mobile sidebar hamburger responds to touch [mobile-sidebar-fixed]"
          git push