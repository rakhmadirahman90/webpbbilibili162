name: Apply Supabase-only news frontend patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-news-supabase-source.py'
      - '.github/workflows/apply-news-supabase-source.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/fix-news-supabase-source.py

      - name: Validate patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/components/News.tsx').read_text(encoding='utf-8')
          forbidden = [
              "DEFAULT_BERITA",
              "cached_berita_list",
              "berita_local_v3",
              "setBeritaList(DEFAULT_BERITA",
              "images.unsplash.com/photo-",
          ]
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit(f'Forbidden legacy news source(s) remain: {bad}')
          required = [
              ".from('berita')",
              "select('id, judul, ringkasan, konten, kategori, gambar_url, tanggal, created_at, likes, views')",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Required Supabase source code missing: {missing}')
          print('Supabase-only news source validation passed')
          PY

      - name: Commit patched frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/News.tsx scripts/fix-news-supabase-source.py .github/workflows/apply-news-supabase-source.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: make frontend news Supabase single source of truth'
            git push
          fi
