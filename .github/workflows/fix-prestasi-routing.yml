name: Fix Prestasi Routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: prestasi routing') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Prestasi route and filter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()

          # UrlSynchronizer menu list
          old = "'berita', 'news', 'faq', 'sambutan', 'sambutan-ketua'"
          new = "'berita', 'news', 'prestasi', 'faq', 'sambutan', 'sambutan-ketua'"
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          # Initial activeView menu list
          old = "'berita', 'news', 'faq']"
          new = "'berita', 'news', 'prestasi', 'faq']"
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          # handleNavigate menu list
          old = "'berita', 'news', 'faq', 'sambutan', 'sambutan-ketua'"
          new = "'berita', 'news', 'prestasi', 'faq', 'sambutan', 'sambutan-ketua'"
          if old in s and s.count(new) < 2:
              s = s.replace(old, new, 1)

          # Dedicated renderer
          marker = "                    {(activeView === 'berita' || activeView === 'news') && <News />}"
          replacement = marker + "\n                    {(activeView === 'prestasi') && <News />}"
          if "(activeView === 'prestasi') && <News />" not in s:
              if marker not in s:
                  raise SystemExit('App.tsx render marker not found')
              s = s.replace(marker, replacement, 1)

          app.write_text(s)

          news = Path('src/components/News.tsx')
          n = news.read_text()

          marker = "export default function News() {\n"
          insert = "export default function News() {\n  // Prestasi is a dedicated public view: only records whose kategori is Prestasi are shown.\n  const prestasiOnly = typeof window !== 'undefined' && window.location.pathname.toLowerCase() === '/prestasi';\n"
          if 'const prestasiOnly =' not in n:
              if marker not in n:
                  raise SystemExit('News.tsx function marker not found')
              n = n.replace(marker, insert, 1)

          marker = "    let result = [...beritaList];\n\n    // Filter by Category"
          replacement = "    let result = [...beritaList];\n\n    // Dedicated Prestasi menu filter (case-insensitive)\n    if (prestasiOnly) {\n      result = result.filter(item => item.kategori?.trim().toLowerCase() === 'prestasi');\n    }\n\n    // Filter by Category"
          if "Dedicated Prestasi menu filter" not in n:
              if marker not in n:
                  raise SystemExit('News.tsx filteredNews marker not found')
              n = n.replace(marker, replacement, 1)

          old = "[beritaList, selectedCategory, orderBy, orderDirection, searchTerm]"
          new = "[beritaList, selectedCategory, orderBy, orderDirection, searchTerm, prestasiOnly]"
          if old in n:
              n = n.replace(old, new, 1)

          news.write_text(n)
          PY

      - name: Verify
        run: |
          grep -q "'berita', 'news', 'prestasi'" src/App.tsx
          grep -q "activeView === 'prestasi'" src/App.tsx
          grep -q "const prestasiOnly" src/components/News.tsx
          grep -q "kategori.*prestasi" src/components/News.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/News.tsx
          git commit -m "fix: prestasi routing and filter"
          git push
